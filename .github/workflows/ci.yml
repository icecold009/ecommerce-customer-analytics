name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Verify fixture pipeline behavior
        run: >-
          python -m pytest --basetemp .pytest-tmp
          tests/test_analysis.py::test_run_pipeline_loads_database_and_writes_all_outputs
          tests/test_analysis.py::test_sql_fixture_fatal_validation_stops_before_business_queries
      - name: Full test suite and coverage
        run: python -m pytest --basetemp .pytest-tmp --cov=analysis --cov=load_database --cov-report=term-missing
